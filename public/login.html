<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Buen Precio - Login</title>

<style>

/*  FONDO */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background: url('imagen/supermercado.jpg') no-repeat center center/cover;
}

/*  CAPA OSCURA */
.overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
}

/* CONTENEDOR */
.container {
    position: relative;
    z-index: 1;
    text-align: center;
    width: 100%;
    padding: 20px;
}

/*  LOGO */
.logo {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
}

.logo span {
    font-size: 50px;
}

.logo h1 {
    color: white;
    font-size: 32px;
}

.precio {
    color: orange;
}

/*  LOGIN */
.login {
    background: rgba(0,0,0,0.85);
    padding: 25px;
    border-radius: 15px;
    width: 100%;
    max-width: 350px;
    margin: auto;
}

/* TEXTOS */
h2 {
    color: white;
    margin-bottom: 15px;
}

/* INPUTS */
.input-group {
    position: relative;
    width: 100%;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
    box-sizing: border-box;
}

/*  OJITO */
.ojito {
    position: absolute;
    right: 12px;
    top: 65%;
    transform: translateY(-50%);
    cursor: pointer;
}

/*  BOTÓN */
button {
    width: 100%;
    padding: 12px;
    margin-top: 18px;
    border-radius: 8px;
    border: none;
    background: orange;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #e67e00;
}

/* MENSAJE */
#mensaje {
    margin-top: 10px;
    color: #ff7675;
}

/*  RESPONSIVE */
@media (max-width: 480px) {
    .logo span {
        font-size: 35px;
    }

    .logo h1 {
        font-size: 24px;
    }

    .login {
        padding: 20px;
    }
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">

    <div class="logo">
        <span>🛒</span>
        <h1>El Buen <span class="precio">Precio</span></h1>
    </div>

    <div class="login">
        <h2>Iniciar Sesión</h2>

        <input type="text" id="usuario" placeholder="Usuario">

        <div class="input-group">
            <input type="password" id="password" placeholder="Contraseña">
            <span class="ojito" onclick="togglePassword()">👁</span>
        </div>

        <!--  BOTÓN ARREGLADO -->
        <button onclick="login()">Ingresar</button>

        <p id="mensaje"></p>
    </div>

</div>

<script>

/*  OJITO */
function togglePassword(){
    const input = document.getElementById("password");
    input.type = input.type === "password" ? "text" : "password";
}

/*  LOGIN */
function login() {
    let usuario = document.getElementById("usuario").value;
    let password = document.getElementById("password").value;

    if (usuario === "admin" && password === "1234") {
        localStorage.setItem("rol", "admin");
        window.location.href = "dashboard.html";
    } else if (usuario === "cajera" && password === "5678") {
        localStorage.setItem("rol", "cajera");
        window.location.href = "dashboard.html";
    } else {
        document.getElementById("mensaje").innerText = "Usuario o contraseña incorrectos";
    }
}

</script>

</body>
</html>
