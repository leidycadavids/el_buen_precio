<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>El Buen Precio - Login</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #1e1e2f, #2c2c54);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 🔥 FONDO ANIMADO */
.fondo {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 0;
}

.fondo span {
    position: absolute;
    font-size: 30px;
    animation: flotar 10s linear infinite;
    opacity: 0.2;
}

/* POSICIONES DIFERENTES */
.fondo span:nth-child(1){ left:10%; animation-duration: 12s; }
.fondo span:nth-child(2){ left:25%; animation-duration: 15s; }
.fondo span:nth-child(3){ left:40%; animation-duration: 10s; }
.fondo span:nth-child(4){ left:55%; animation-duration: 14s; }
.fondo span:nth-child(5){ left:70%; animation-duration: 11s; }
.fondo span:nth-child(6){ left:85%; animation-duration: 13s; }

/* ANIMACIÓN */
@keyframes flotar {
    0% {
        bottom: -50px;
        transform: translateX(0);
    }
    50% {
        transform: translateX(30px);
    }
    100% {
        bottom: 110%;
        transform: translateX(-30px);
    }
}

/* LOGIN */
.login {
    position: relative;
    z-index: 1;
    background: rgba(44, 44, 84, 0.9);
    backdrop-filter: blur(8px);
    padding: 40px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0px 10px 30px rgba(0,0,0,0.7);
    width: 300px;
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-40px); }
    to { opacity: 1; transform: translateY(0); }
}

h2 { color: #fff; }
h3 { color: #dfe6e9; }

input {
    display: block;
    margin: 12px auto;
    padding: 12px;
    width: 100%;
    border-radius: 8px;
    border: none;
    background: #f1f2f6;
}

button {
    background: #00cec9;
    color: white;
    border: none;
    padding: 12px;
    width: 100%;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #00b894;
}

#mensaje {
    margin-top: 10px;
    color: #ff7675;
}

</style>
</head>

<body>

<!-- 🔥 ELEMENTOS FLOTANTES -->
<div class="fondo">
    <span>🛒</span>
    <span>🥦</span>
    <span>🍎</span>
    <span>🥕</span>
    <span>🍞</span>
    <span>🥛</span>
</div>

<div class="login">
    <h2>🛒 El Buen Precio</h2>
    <h3>Iniciar Sesión</h3>

    <input type="text" id="usuario" placeholder="Usuario">
    <input type="password" id="password" placeholder="Contraseña">

    <button onclick="login()">Ingresar</button>

    <p id="mensaje"></p>
</div>

<script>
function login() {
    let usuario = document.getElementById("usuario").value;
    let password = document.getElementById("password").value;

    if (usuario === "admin" && password === "1234") {
        window.location.href = "dashboard.html";
    } else if (usuario === "cajera" && password === "5678") {
        window.location.href = "dashboard.html";
    } else {
        document.getElementById("mensaje").innerText = "Usuario o contraseña incorrectos";
    }
}
</script>

</body>
</html>
