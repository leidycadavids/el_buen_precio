<!DOCTYPE html> 
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Créditos - El Buen Precio</title>

<style>
body { margin:0; font-family:Arial; display:flex; }

.sidebar {
    width:220px; background:#1e1e2f; color:white;
    height:100vh; padding:20px;
}

.sidebar a {
    display:block; color:#ccc; padding:10px;
    text-decoration:none; margin-top:10px;
}

.sidebar a:hover { background:#00cec9; color:white; }

.content {
    flex:1; padding:20px; background:#f5f6fa;
}

.card {
    background:white; padding:15px; margin:10px 0;
    border-radius:10px; box-shadow:0px 5px 10px rgba(0,0,0,0.1);
}

button {
    background:#00cec9; color:white; border:none;
    padding:8px 12px; border-radius:6px; cursor:pointer;
    margin-top:5px;
}

button:hover { background:#00b894; }

input, select {
    display:block; margin:5px 0; padding:8px; width:220px;
}

.toggle {
    color:#0984e3;
    cursor:pointer;
    font-size:14px;
    margin-top:5px;
}

/* RESPONSIVE ORIGINAL */
@media (max-width: 768px) {
    body { flex-direction: column; }

    .sidebar {
        width:100%; height:auto; display:flex; overflow-x:auto;
    }

    .sidebar a {
        flex:1; text-align:center; font-size:12px;
    }

    .content { padding:10px; }

    input, select { width:100%; }
}

/* MEJORAS */
@media (max-width: 768px) {
    .card { padding:10px; }
    .card button { width:100%; margin:5px 0; }
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>🛒 El Buen Precio</h2>

    <a href="dashboard.html">🏠 Inicio</a>
    <a href="clientes.html">👥 Clientes</a>
    <a href="creditos.html">💳 Créditos</a>
    <a href="abonos.html">💰 Abonos</a>
    <a href="cartera.html" class="menu-cartera">📊 Cartera</a>

    <a href="#" onclick="cerrarSesion()">🚪 Cerrar sesión</a>
</div>

<div class="content">
    <h1>Créditos</h1>

    <input type="text" id="buscadorCredito" placeholder="Buscar cliente por nombre o cédula..." onkeyup="filtrarCreditos()">

    <button onclick="mostrarFormulario()">➕ Registrar crédito a un NUEVO cliente</button>

    <div id="formulario" style="display:none;">
        <input type="text" id="buscadorCliente" placeholder="Buscar cliente..." onkeyup="filtrarClientes()">
        <select id="clienteId"></select>
        <input type="text" id="producto" placeholder="Producto">
        <input type="number" id="monto" placeholder="Monto">
        <button onclick="crearCredito()">Guardar</button>
    </div>

    <div id="creditos"></div>
</div>

<script>

let listaClientes = [];
let creditosAgrupados = [];
let copiaOriginalCreditos = {};
let mostrarHistorial = {};

const rol = localStorage.getItem("rol");

document.addEventListener("DOMContentLoaded", () => {
    if (rol === "cajera") {
        document.querySelectorAll(".menu-cartera").forEach(el => {
            el.style.display = "none";
        });
    }
});

function mostrarFormulario(){
    let f = document.getElementById('formulario');
    f.style.display = f.style.display === 'none' ? 'block' : 'none';
}

// CLIENTES
function cargarClientes(){
    fetch('/clientes')
    .then(r=>r.json())
    .then(data=>{
        listaClientes = data;
        renderClientes(data);
    });
}

function renderClientes(data){
    const select = document.getElementById('clienteId');
    const seleccionado = select.value;

    select.innerHTML = '<option value="">Seleccionar cliente</option>';

    data.forEach(c=>{
        select.innerHTML += `
            <option value="${c.id}">
                ${c.nombre} ${c.apellido1} ${c.apellido2} - ${c.cedula}
            </option>`;
    });

    select.value = seleccionado;
}

function filtrarClientes(){
    const txt = document.getElementById('buscadorCliente').value.toLowerCase();

    const filtrados = listaClientes.filter(c=>{
        const nombre = `${c.nombre} ${c.apellido1} ${c.apellido2}`.toLowerCase();
        const cedula = String(c.cedula);
        return nombre.includes(txt) || cedula.includes(txt);
    });

    renderClientes(filtrados);
}

// CREDITOS
function cargarCreditos(){
    fetch('/creditos')
    .then(r=>r.json())
    .then(data=>{

        creditosAgrupados = {};
        copiaOriginalCreditos = {};

        data.forEach(c=>{
            if(!creditosAgrupados[c.clienteId]){
                creditosAgrupados[c.clienteId] = {
                    nombre: `${c.nombre} ${c.apellido1} ${c.apellido2}`,
                     cedula: c.cedula,
                    total:0,
                    creditos:[]
                };
            }

            creditosAgrupados[c.clienteId].total += parseFloat(c.monto);
            creditosAgrupados[c.clienteId].creditos.push(c);
        });

        copiaOriginalCreditos = JSON.parse(JSON.stringify(creditosAgrupados));

        renderCreditos(creditosAgrupados);
    });
}

// RENDER
function renderCreditos(data){
    const cont = document.getElementById('creditos');
    cont.innerHTML = '';

    Object.keys(data).forEach(id=>{
        const cl = data[id];

        if(cl.total <= 0) return;

        cont.innerHTML += `
        <div class="card">
            <h3>${cl.nombre}</h3>
            <p><strong>Total: $${cl.total}</strong></p>

            <button onclick="agregarCreditoDirecto(${id})">➕ Crédito</button>
            <button onclick="abonoGeneral(${id})">💰 Abonar</button>
            <button onclick="verDetalle(${id})">Ver detalle</button>

            <div id="detalle-${id}" style="display:none;"></div>
        </div>`;
    });
}

// BUSCADOR
function filtrarCreditos(){
    const txt = document.getElementById('buscadorCredito').value.toLowerCase();

    const filtrados = {};

    Object.keys(copiaOriginalCreditos).forEach(id=>{
        const cl = copiaOriginalCreditos[id];

        const nombre = cl.nombre.toLowerCase();
        const cedula = String(cl.cedula || "");

        if(nombre.includes(txt) || cedula.includes(txt)){
            filtrados[id] = cl;
        }
    });

    renderCreditos(filtrados);
}

// DETALLE
function verDetalle(id){
    const div = document.getElementById(`detalle-${id}`);
    const cliente = creditosAgrupados[id];

    if(div.style.display === 'none'){
        div.style.display = 'block';
    } else {
        div.style.display = 'none';
        return;
    }

    renderDetalle(id);
}

// RENDER DETALLE
function renderDetalle(id){
    const div = document.getElementById(`detalle-${id}`);
    const cliente = creditosAgrupados[id];

    div.innerHTML = `
        <span class="toggle" onclick="event.stopPropagation(); toggleHistorial(${id})">
            ${mostrarHistorial[id] ? '📜 Ocultar historial' : '📜 Ver historial'}
        </span>
    `;

    let lista = cliente.creditos;

    if(!mostrarHistorial[id]){
        lista = lista.filter(c => c.estado === "pendiente");
    }

    if(lista.length === 0){
        div.innerHTML += `<p style="color:green;">✅ Cliente al día</p>`;
    }

    lista.forEach(c=>{
        div.innerHTML += `
        <div style="background:${c.estado === 'pagado' ? '#dfe6e9' : '#eee'}; padding:8px; margin:5px;">
            ${c.producto} - $${c.monto}<br>

            <strong style="color:${c.estado === 'pagado' ? 'green' : 'red'}">
                ${c.estado === 'pagado' ? 'PAGADO' : 'PENDIENTE'}
            </strong><br>

            📅 ${new Date(c.fecha).toLocaleString()}<br>
            <button onclick="eliminarCredito(${c.id})">Eliminar</button>
        </div>`;
    });
}

// TOGGLE
function toggleHistorial(id){
    mostrarHistorial[id] = !mostrarHistorial[id];
    renderDetalle(id);
}

// CREAR
function crearCredito(){ 
    const clienteId = document.getElementById('clienteId').value;
    const producto = document.getElementById('producto').value;
    const monto = document.getElementById('monto').value;

    if(!clienteId || !producto || !monto){
        alert("Completa todos los campos");
        return;
    }

    fetch('/creditos', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({clienteId, producto, monto})
    }).then(()=>{
        alert('Credito creado');

        document.getElementById('producto').value = '';
        document.getElementById('monto').value = '';
        document.getElementById('formulario').style.display = 'none';

        cargarCreditos();
    });
}

function agregarCreditoDirecto(id){
    const producto = prompt("Producto:");
    if(!producto) return;

    const monto = prompt("Monto:");
    if(!monto) return;

    fetch('/creditos',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({clienteId:id, producto, monto})
    }).then(()=>cargarCreditos());
}

function abonoGeneral(id){
    const monto = prompt("Monto a abonar");
    if(!monto) return;

    fetch('/abonos/general',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({clienteId:id, monto})
    }).then(()=>{
        alert('Abono hecho');
        cargarCreditos();
    });
}

function eliminarCredito(id){
    fetch(`/creditos/${id}`,{
        method:'DELETE'
    }).then(()=>cargarCreditos());
}

// INIT
cargarClientes();
cargarCreditos();

function cerrarSesion(){
    localStorage.removeItem('usuario');
    window.location.href = "login.html";
}

</script>

</body>
</html>
